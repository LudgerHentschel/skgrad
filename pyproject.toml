[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skgrad"
version = "0.1.6"
description = "Analytic input gradients for fitted scikit-learn models"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Ludger Hentschel"}]
keywords = [
    "scikit-learn",
    "input-gradients",
    "jacobian",
    "sensitivity-analysis",
    "integrated-gradients",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "scipy>=1.3.2",
    "threadpoolctl>=3.1",
]

[project.urls]
Documentation = "https://ludgerhentschel.github.io/skgrad/"
Changelog = "https://github.com/LudgerHentschel/skgrad/blob/main/CHANGELOG.md"
Homepage = "https://github.com/LudgerHentschel/skgrad"
Repository = "https://github.com/LudgerHentschel/skgrad"
Issues = "https://github.com/LudgerHentschel/skgrad/issues"

[project.optional-dependencies]
docs = [
    "sphinx>=7,<9",
    "sphinx-sitemap>=2.6,<3",
    "myst-parser>=3,<5",
    "pydata-sphinx-theme>=0.16,<0.17",
]
test = [
    "pandas>=1.5",
    "build>=1",
    "pytest>=7",
    "tomli>=2; python_version < '3.11'",
    "twine>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skgrad = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skgrad"
version = "0.1.0.dev0"
description = "Analytic input gradients for fitted scikit-learn models"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Ludger Hentschel"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23", "scikit-learn>=1.2"]

[project.urls]
Homepage = "https://github.com/LudgerHentschel/skgrad"
Repository = "https://github.com/LudgerHentschel/skgrad"
Issues = "https://github.com/LudgerHentschel/skgrad/issues"

[project.optional-dependencies]
test = [
    "build>=1",
    "pytest>=7",
    "tomli>=2; python_version < '3.11'",
    "twine>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skgrad = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
